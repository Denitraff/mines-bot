<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Генератор игр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: игровой, ночной, честный
   IDEA: игровой автомат-меню: карточки игр, внутри каждой — копия её поля
   PICTURE: поле Mines, дорога Chicken Road, рельсы Subway, кривая Aviator
   COLOUR and TYPE: тёмно-синий фон, у каждой игры свой акцент; Unbounded + Manrope
   LAYOUT: шапка с «Назад», поле сверху, управление под ним (рядом на широком экране) */
:root{color-scheme:dark;--bg:#0d1224;--panel:#121a33;--line:#24335a;--ink:#e8eefc;--mute:#93a2c7;--teal:#1f9fb8;--teal2:#137189;--or:#f08a2c;--ok:#4fd1a5;--bad:#ff5d6c;--acc:var(--or)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 700px at 30% -10%,#1a2550 0,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.band{padding:clamp(16px,3vw,40px) max(4vw,14px) 40px;max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;min-height:44px}
.back{font:700 15px Manrope,sans-serif;color:var(--ink);background:#1a2445;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
h1{font:700 clamp(22px,3.6vw,36px)/1.1 Unbounded,sans-serif;margin:0;text-wrap:balance}
[hidden]{display:none!important}
button{font-family:Manrope,system-ui,sans-serif}
button:focus-visible,input:focus-visible{outline:3px solid #8fd8ff;outline-offset:2px}
/* menu */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;border-radius:22px;padding:18px;width:100%;aspect-ratio:1 / 1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;border:1px solid #ffffff1a;box-shadow:0 18px 40px -20px #000c;transition:transform .15s}
.card:hover{transform:translateY(-2px)}.card:focus-visible{outline:3px solid #8fd8ff}
.card svg.art{position:absolute;right:10px;top:10px;height:56%;width:auto;max-width:55%;opacity:.95}
.card b,.card span{text-shadow:0 2px 8px #0009}
.card b{font:700 21px/1.1 Unbounded,sans-serif;position:relative}
.card span{color:#ffffffc0;font-size:14px;position:relative}
.c-mines{background:linear-gradient(150deg,#14324a,#0b1730)}
.c-road{background:linear-gradient(150deg,#55565c,#2e2f35)}
.c-sub{background:linear-gradient(150deg,#d9481e,#7c1d0d)}
.c-av{background:linear-gradient(150deg,#2a0a12,#0b0b0f)}
.menu-sub{color:var(--mute);margin:0 0 18px}

/* Embedded artwork: keep the complete image visible above the card caption. */
.card img.art{position:absolute;top:0;left:0;width:100%;height:calc(100% - 92px);object-fit:contain;pointer-events:none}
.card:has(img.art) b,.card:has(img.art) span{z-index:1}

/* shared */
.wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.4vw,22px)}
.lbl{font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.lbl span{color:var(--mute);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px;margin-bottom:20px}
.seg button,.step{font:700 15px Manrope,sans-serif;color:var(--ink);background:#1a2445;border:1px solid var(--line);border-radius:12px;min-height:46px;cursor:pointer;padding:0 4px}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#140b02}
.cnt{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:10px;align-items:center;margin-bottom:20px}
.step{font-size:22px}
input[type=range]{width:100%;accent-color:var(--acc);height:44px}
.go{width:100%;border:0;border-radius:14px;min-height:56px;font:800 18px Manrope,sans-serif;color:#140b02;background:var(--acc);cursor:pointer;box-shadow:0 8px 20px -8px #000}
.go:active{transform:translateY(1px)}
.odds{display:flex;align-items:baseline;gap:12px;margin:20px 0 4px;flex-wrap:wrap}
.big{font:700 clamp(32px,5vw,44px)/1 Unbounded,sans-serif;white-space:nowrap}
.odds small{color:var(--mute)}
.meter{height:10px;border-radius:6px;background:#0a0f20;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--or),var(--ok));transition:width .3s}
.mult{color:var(--mute);font-size:14px;margin:0}.mult b{color:var(--ink)}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;min-height:32px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid #1d2a4d;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600}
tr.cur td{color:var(--acc);font-weight:700}
.rtp{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.rtp input{width:84px;font:700 16px Manrope,sans-serif;color:var(--ink);background:#0a0f20;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
.note{margin-top:24px;padding:14px 16px;border-radius:16px;background:#1a1530;border:1px solid #3a2c5c;color:#d6cdf0;font-size:14px;max-width:80ch}
.note b{color:#fff}
/* mines */
#v-mines{--acc:#f08a2c}
.board{background:linear-gradient(#0a0f20,#0a0f20) padding-box,linear-gradient(180deg,#5b7fb8,#1b2648 40%,#5b7fb8) border-box;border:3px solid transparent;border-radius:26px;padding:clamp(10px,2vw,16px);box-shadow:0 30px 60px -20px #000a;width:100%;max-width:520px;margin:0 auto;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(5px,1.4vw,11px);aspect-ratio:1/1;width:100%}
.cell{min-height:0;overflow:hidden;border-radius:14%;background:linear-gradient(160deg,#2bb3cc 0,var(--teal) 45%,var(--teal2) 100%);box-shadow:inset 0 2px 0 #ffffff40,inset 0 -4px 0 #0003,0 3px 6px #0007;position:relative}
.cell.on{background:transparent;box-shadow:none}
.cell svg{position:absolute;inset:6%;width:88%;height:88%;filter:drop-shadow(0 3px 3px #0008)}
.cell:not(.on) svg{display:none}
.cell.on svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.cell .n{position:absolute;top:4%;left:8%;font:700 11px Manrope,sans-serif;color:#fff}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
/* road */
#v-road{--acc:#f5c518}
.road{background:#5b5c62;border-radius:22px;padding:22px 0;overflow-x:auto;scrollbar-width:thin;box-shadow:inset 0 0 0 3px #ffffff14,0 24px 50px -24px #000c;scroll-behavior:smooth}
.lane{display:flex;gap:0;padding:0 14px;width:max-content}
.mh{width:96px;flex:none;display:grid;place-items:center;position:relative;padding:34px 0;border-right:3px dashed #ffffffb0}
.mh:last-child{border-right:0}
.mh i{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:700 14px Manrope,sans-serif;font-style:normal;color:#d8d8dc;background:radial-gradient(circle,#4a4b50 0 55%,#3a3b40 56% 64%,#4a4b50 65%);box-shadow:inset 0 0 0 4px #2f3035;white-space:nowrap}
.mh.pass i{background:radial-gradient(circle,#2d6b4f 0 60%,#1f4e39 61%);color:#d9ffe9}
.mh.stop i{background:radial-gradient(circle,#f5c518 0 60%,#c99a00 61%);color:#1d1600;transform:scale(1.12)}
.mh .s{position:absolute;top:6px;font-size:12px;color:#ffffffb0}
.mh.stop .s{color:#f5c518;font-weight:800}
.flag{position:absolute;bottom:4px;font:800 12px Manrope,sans-serif;color:#f5c518}
/* subway */
#v-subway{--acc:#c6f13a}
.rails{background:linear-gradient(180deg,#8fd3ff 0,#f4e7c5 22%,#c2481f 23%,#9a3313 100%);border-radius:22px;padding:18px 14px;box-shadow:0 24px 50px -24px #000c}
.srow{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr)) 78px;gap:8px;align-items:center;margin-bottom:8px}
.srow .no{font:700 13px Manrope,sans-serif;color:#fff;text-align:center}
.srow .t{font:800 14px Manrope,sans-serif;text-align:center;padding:12px 2px;border-radius:12px;background:#ffffff26;color:#ffffffc0;border:2px solid #ffffff30;white-space:nowrap}
.srow .t.pick{background:#c6f13a;color:#1a2400;border-color:#e9ff9a;box-shadow:0 6px 14px -6px #000}
.srow .cum{font:800 15px Manrope,sans-serif;color:#fff;text-align:right;white-space:nowrap}
.srow.head .t{background:none;border:0;color:#fff;padding:0;font-size:12px}
.empty{color:#fff;text-align:center;padding:30px 0}
/* aviator */
#v-aviator{--acc:#e8193c}
#v-aviator .go{color:#fff}
#v-aviator .seg button[aria-pressed=true]{color:#fff}
.sky{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 20% 110%,#1d3b6b 0,#0b0d14 60%);min-height:300px;box-shadow:0 24px 50px -24px #000c}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky .x{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(46px,9vw,76px)/1 Unbounded,sans-serif;color:#fff;text-shadow:0 4px 24px #000}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.hist-box{margin-top:16px}
.hist-box textarea{width:100%;min-height:76px;resize:vertical;font:600 16px Manrope,sans-serif;color:var(--ink);background:#0a0f20;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hbtns{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;margin:10px 0 16px}
.hbtns .step{font-size:15px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding:8px;background:#0a0f20;border-radius:12px;overflow-x:auto;margin-bottom:14px}
.bars i{flex:1 0 10px;max-width:22px;border-radius:3px 3px 0 0;background:#3a6bd1;min-height:4px}
.bars i.hi{background:#e8193c}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-bottom:14px}
.stats div{background:#0a0f20;border-radius:12px;padding:10px 12px}
.stats b{display:block;font:700 20px Unbounded,sans-serif;white-space:nowrap}
.stats span{color:var(--mute);font-size:13px}
.verdict{background:#1d0d14;border:1px solid #5a1a2a;border-radius:14px;padding:14px 16px;font-size:15px}
.verdict b{color:#fff}

.hist-box input{width:100%;min-height:48px;font:600 16px Manrope,sans-serif;color:var(--ink);background:#0a0f20;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini-loader{display:flex;justify-content:center;align-items:center;gap:7px;padding:22px 0}
.mini-loader i{width:9px;height:9px;border-radius:50%;background:#e8193c;animation:loaderPulse .75s ease-in-out infinite alternate}
.mini-loader i:nth-child(2){animation-delay:.18s}.mini-loader i:nth-child(3){animation-delay:.36s}
@keyframes loaderPulse{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
.next-result{display:none;text-align:center;padding:12px 0 4px;font:700 clamp(26px,5vw,38px) Unbounded,sans-serif;color:#fff}
@media(max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}.board{max-width:min(480px,100%)}}
body.tg .band{padding-top:12px}
@media(prefers-reduced-motion:reduce){.cell.on svg{animation:none}.road{scroll-behavior:auto}}
/* Language selector and space for longer translated labels. */
.top{flex-wrap:wrap}.top h1{flex:1 1 220px;overflow-wrap:anywhere}
.language-picker{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--mute)}
.language-picker select{max-width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#1a2445;color:var(--ink);font:600 15px/1.5 Manrope,system-ui,sans-serif;cursor:pointer}
select:focus-visible{outline:3px solid #8fd8ff;outline-offset:2px}
.card{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:4px;align-content:stretch;justify-content:stretch}
.card img.art{position:static;width:100%;height:100%;min-height:0;object-fit:contain}
.card span{line-height:1.5;overflow-wrap:anywhere}
.seg button{padding:8px 4px;overflow-wrap:anywhere;line-height:1.4}
.srow.head .t,.srow.head .cum,.srow.head .no{white-space:normal;overflow-wrap:anywhere;font-size:12px}
th{white-space:normal;overflow-wrap:anywhere}.flag{max-width:100%;text-align:center;line-height:1.2}
:lang(hi) h1,:lang(th) h1{line-height:1.4}
@media(max-width:420px){.language-picker{flex-basis:100%;justify-content:flex-end}.seg{gap:5px}.seg button{font-size:14px}.srow{grid-template-columns:34px repeat(3,minmax(0,1fr)) 64px;gap:4px}.srow .t,.srow .cum{font-size:13px}}
</style>
</head>

  let target = 2;
  var aUpdate = function () {
    $('a-x').textContent = target.toFixed(2) + 'x';
    drawSky();
  }
  function drawSky() {
    const s = $('a-svg'), W = s.clientWidth, H = s.clientHeight; if (!W) return;
    const t = Math.min(1, Math.log(target) / Math.log(20));
    const ex = 30 + (W - 90) * (0.35 + 0.65 * t), ey = H - 30 - (H - 90) * (0.25 + 0.75 * t);
    const cx = 30 + (ex - 30) * 0.6, cy = H - 30;
    s.innerHTML = `<defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8193c" stop-opacity=".55"/><stop offset="1" stop-color="#e8193c" stop-opacity=".1"/></linearGradient></defs>
      <path d="M30 ${H - 30} Q${cx} ${cy} ${ex} ${ey} L${ex} ${H - 30} Z" fill="url(#af)"/>
      <path d="M30 ${H - 30} Q${cx} ${cy} ${ex} ${ey}" stroke="#e8193c" stroke-width="4" fill="none"/>
      <use href="#plane" x="${ex - 14}" y="${ey - 30}" width="80" height="34"/>`;
  }
  segInit('a-seg', () => {});
  $('a-go').addEventListener('click', () => {
    const band = BANDS[+$('a-seg').querySelector('[aria-pressed=true]').dataset.v];
    target = Math.round(band[0] * Math.pow(band[1] / band[0], rndF()) * 100) / 100;
    buzz('medium'); aUpdate();
  });
  const skyRo = new ResizeObserver(drawSky); skyRo.observe($('a-sky'));

  /* ---------- AVIATOR NEXT ROUND UI ---------- */
  $('h-go').addEventListener('click', () => {
    const previous = $('h-in').value.trim();
    if (!previous) { $('h-in').focus(); return; }
    const parsed = Number(previous.replace(',', '.').replace(/[xX×]/g, '').trim());
    if (!Number.isFinite(parsed) || parsed < 1) { $('h-in').focus(); $('h-in').setCustomValidity(t('invalid')); $('h-in').reportValidity(); return; }
    $('h-in').setCustomValidity('');
    $('h-out').hidden = false;
    $('h-loader').style.display = 'flex';
    $('h-result').style.display = 'none';
    const band = BANDS[+$('a-seg').querySelector('[aria-pressed=true]').dataset.v];
    const generated = Math.round(band[0] * Math.pow(band[1] / band[0], rndF()) * 100) / 100;
    setTimeout(() => {
      target = generated;
      buzz('medium');
      aUpdate();
      $('h-loader').style.display = 'none';
      $('h-result').style.display = 'block';
      lastNext = target;
      $('h-result').textContent = t('nextResult', {x: lastNext.toFixed(2)});
    }, 1200);
  });

  $('h-in').addEventListener('input', () => $('h-in').setCustomValidity(''));
  $('language').addEventListener('change', e => {
    if (!Object.hasOwn(I18N, e.target.value)) return;
    language = e.target.value;
    try { localStorage.setItem('game-generator-language', language); } catch (e) {}
    applyLanguage();
  });
  applyLanguage();
}
</script>
</body>
</html>
